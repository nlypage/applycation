openapi: 3.0.3
info:
  title: applycation API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
components:
  schemas:
    Error:
      type: object
      description: Base error response for API failures.
      properties:
        code:
          type: string
          example: internal_error
        message:
          type: string
          example: Unexpected server error
      required:
        - code
        - message
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: Validation details for malformed input.
          properties:
            details:
              type: object
              additionalProperties:
                type: string
              example:
                field: must be a valid value

[tools]
go = "1.26.0"
mockery = "3.7.0"
node = "22.16.0"
oapi-codegen = "2.7.0"
pnpm = "10.12.1"
sqlc = "1.31.1"

[env]
PROJECT_NAME = "applycation"

# Daily commands
[tasks.setup]
description = "Install dependencies and generate code"
run = ["mise run frontend:deps", "mise run backend:tidy"]

[tasks.dev]
description = "Run backend and frontend dev servers"
shell = "bash -c"
run = """
set -euo pipefail

mise run backend:dev &
backend_pid=$!

mise run frontend:dev &
frontend_pid=$!

trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' INT TERM EXIT

set +e
wait -n "$backend_pid" "$frontend_pid"
status=$?
set -e

kill "$backend_pid" "$frontend_pid" 2>/dev/null || true
wait "$backend_pid" "$frontend_pid" 2>/dev/null || true
exit "$status"
"""

[tasks.lint]
description = "Run all linters"
run = ["mise run backend:lint", "mise run frontend:lint"]

[tasks.test]
description = "Run all tests"
run = ["mise run backend:test", "mise run frontend:test"]

[tasks.codegen]
description = "Generate backend code"
run = [
  "mise run codegen:openapi",
  "mise run codegen:sqlc",
  "mise run codegen:mocks",
]

# Docker
[tasks."docker:up"]
description = "Start Docker Compose stack"
run = "docker compose --env-file .env up --build"

[tasks."docker:down"]
description = "Stop Docker Compose stack"
run = "docker compose --env-file .env down"

[tasks."docker:logs"]
description = "Follow Docker Compose logs"
run = "docker compose --env-file .env logs -f"

[tasks."docker:config"]
description = "Validate Docker Compose configuration"
hide = true
run = "docker compose --env-file .env config --quiet"

[tasks."docker:build"]
description = "Build Docker Compose images"
hide = true
run = "docker compose --env-file .env build"

# Backend
[tasks."backend:dev"]
description = "Run backend dev server"
run = ["mise run codegen", "cd backend && go run ./cmd/server"]

[tasks."backend:lint"]
description = "Lint backend"
hide = true
run = ["mise run codegen", "cd backend && go vet ./..."]

[tasks."backend:test"]
description = "Run backend tests"
hide = true
run = ["mise run codegen", "cd backend && go test ./..."]

[tasks."backend:test:unit"]
description = "Run backend unit tests only"
run = ["mise run codegen", "cd backend && go test -short ./..."]

[tasks."backend:test:integration"]
description = "Run backend integration tests with database"
run = [
  "mise run codegen",
  "cd backend && go test ./internal/adapters/secondary/postgres/... ./internal/testutil/...",
]

[tasks."backend:tidy"]
description = "Generate backend code and tidy Go modules"
hide = true
run = ["mise run codegen", "cd backend && go mod tidy"]

# Backward-compatible aliases for older CI/scripts.
[tasks."backend:deps"]
description = "Deprecated: use backend:tidy"
hide = true
run = "mise run backend:tidy"

[tasks."backend:lint:check"]
description = "Deprecated: use backend:lint"
hide = true
run = "mise run backend:lint"

[tasks."backend:test:check"]
description = "Deprecated: use backend:test"
hide = true
run = "mise run backend:test"

# Frontend
[tasks."frontend:dev"]
description = "Run frontend dev server"
dir = "frontend"
run = "pnpm dev"

[tasks."frontend:lint"]
description = "Lint frontend"
hide = true
dir = "frontend"
run = "pnpm lint"

[tasks."frontend:test"]
description = "Run frontend tests"
hide = true
dir = "frontend"
run = "pnpm test"

[tasks."frontend:deps"]
description = "Install frontend dependencies"
hide = true
dir = "frontend"
run = "pnpm install --frozen-lockfile"

# Code generation internals
[tasks."codegen:openapi"]
description = "Generate OpenAPI backend code"
hide = true
run = "cd backend/internal/adapters/primary/http/openapi && oapi-codegen --config cfg.yaml ../../../../../../api/openapi.yaml"

[tasks."codegen:sqlc"]
description = "Generate sqlc queries"
hide = true
run = "if find db/queries -name '*.sql' -print -quit | grep -q .; then sqlc generate -f db/sqlc.yaml; else echo 'skip sqlc codegen: db/queries has no .sql files yet'; fi"

[tasks."codegen:mocks"]
description = "Generate Go mocks with mockery"
hide = true
run = "cd backend && mockery --config .mockery.yaml"

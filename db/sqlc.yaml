version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "../backend/internal/adapters/secondary/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_methods_with_db_argument: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
